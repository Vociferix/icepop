name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      # One invocation for the whole workspace, so the crates share a search index. The
      # `docsrs` cfg is what the crates gate `doc_cfg` on, matching their docs.rs metadata.
      # (`cargo docs-rs` runs per package and puts proc-macro crates in a different target
      # directory, which would drop `portable-derive` from the site; CI checks the packages
      # that way instead.)
      # No `-D warnings` here: the CI `docs` job already gates that on every PR, and a
      # newly-introduced nightly rustdoc lint should not be able to block a deploy of docs
      # that are otherwise fine.
      - name: Build documentation
        env:
          RUSTDOCFLAGS: --cfg docsrs
        run: cargo doc --workspace --all-features --no-deps

      - name: Add a site root and disable Jekyll
        run: |
          set -euo pipefail
          echo '<meta http-equiv="refresh" content="0; url=icepop/index.html">' \
            > target/doc/index.html
          # Without this, Pages runs the output through Jekyll, which drops the
          # underscore-prefixed directories rustdoc emits.
          touch target/doc/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
